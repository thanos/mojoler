# Linux x86-64 CPU NIF. GitHub-hosted runners have no GPU, so this job does
# not test Mojo device code. A green run is the Linux row; it does not change
# the macOS PASS by itself until the log is recorded.
name: linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nif:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3.1"
          elixir-version: "1.20.2"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install Mojo 1.1.0
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Doctor
        run: scripts/doctor.sh

      - name: ABI experiments
        run: scripts/run-abi-experiments.sh

      - name: ExUnit
        run: scripts/test-isolated.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abi-observed
          path: experiments/abi/OBSERVED.txt
          if-no-files-found: warn
